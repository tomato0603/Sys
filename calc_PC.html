<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<title>実験試薬計算システム</title>
		<style>
			:root {
				--primary-color: #4a90e2;
				--bg-color: #f5f7fa;
				--card-bg: #ffffff;
				--text-color: #333;
				--border-color: #ddd;
				--accent-color: #2c3e50;
				
				/* 🩵 マスターリスト（優しい青テーマ）用の変数 */
				--master-body-bg: #eff6ff; /* 画面全体の優しいパステルブルー */
				--master-card-bg: #ffffff; /* コンテナは白を維持してスッキリ */
				--master-text: #1e3a8a;
				--master-border: #cbd5e1;   /* スタイリッシュなライトグレー */
				--master-accent: #3b82f6;   /* アクセントの優しい青 */
			}
			body {
				font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
				background-color: var(--bg-color);
				color: var(--text-color);
				line-height: 1.5;
				margin: 0;
				padding: 20px;
				transition: background-color 0.2s;
			}
			
			/* 🩵 マスターリスト選択時：画面全体を優しい青に変える */
			body.master-mode-active {
				background-color: var(--master-body-bg);
			}
			
			.container {
				max-width: 850px;
				margin: 0 auto;
				background: var(--card-bg);
				padding: 30px;
				border-radius: 0 0 8px 8px;
				box-shadow: 0 4px 6px rgba(0,0,0,0.1);
				transition: background-color 0.2s, color 0.2s;
			}
			
			/* マスターモード時のコンテナ内装飾（ダークは使わずグレーと青で構成） */
			.container.master-mode {
				color: #334155; /* 濃いグレーの文字 */
			}
			.container.master-mode h1, 
			.container.master-mode h2, 
			.container.master-mode h3 {
				color: var(--master-text);
				border-bottom-color: var(--master-accent);
			}
			.container.master-mode label {
				color: #475569; /* ミディアムグレー */
			}
			
			/* タブナビゲーション */
			.tab-navigation {
				max-width: 850px;
				margin: 0 auto;
				display: flex;
				background: #e2e8f0;
				border-radius: 8px 8px 0 0;
				overflow: hidden;
				transition: background-color 0.2s;
			}
			.tab-navigation.master-active {
				background: #dbeafe; /* ナビゲーションバーも優しい青系グレーに */
			}
			.tab-btn {
				flex: 1;
				padding: 15px 20px;
				font-size: 16px;
				font-weight: bold;
				color: #4a5568;
				background: #e2e8f0;
				border: none;
				cursor: pointer;
				transition: background 0.2s, color 0.2s;
				text-align: center;
			}
			.tab-btn:hover { background: #cbd5e1; }
			.tab-btn.active {
				background: var(--card-bg);
				color: var(--primary-color);
				border-bottom: 3px solid var(--primary-color);
			}
			.tab-navigation.master-active .tab-btn.active {
				background: var(--card-bg);
				color: var(--master-accent);
				border-bottom: 3px solid var(--master-accent);
			}
			
			.tab-content { display: none; }
			.tab-content.active { display: block; }
			
			h1, h2 {
				color: var(--accent-color);
				border-bottom: 2px solid var(--primary-color);
				padding-bottom: 8px;
				margin-top: 30px;
			}
			h1 { margin-top: 0; }
			.section { margin-bottom: 30px; }
			.input-group { margin-bottom: 15px; }
			.inline-group {
				display: grid;
				grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr auto;
				gap: 8px;
				align-items: end;
			}
			label {
				display: block;
				font-weight: bold;
				margin-bottom: 5px;
				font-size: 14px;
			}
			input[type="number"], input[type="text"], select {
				width: 100%;
				padding: 10px;
				font-size: 15px;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				box-sizing: border-box;
				background-color: #ffffff;
				color: #333333;
			}
			
			/* マスターモード時の入力欄枠線 */
			.container.master-mode input[type="number"], 
			.container.master-mode input[type="text"], 
			.container.master-mode select {
				border-color: var(--master-border);
			}
			
			.btn {
				background-color: var(--primary-color);
				color: white;
				padding: 12px 20px;
				border: none;
				border-radius: 4px;
				font-size: 16px;
				cursor: pointer;
				font-weight: bold;
			}
			.btn:hover { background-color: #357abd; }
			.btn-danger { background-color: #e74c3c; color: white; }
			.btn-danger:hover { background-color: #c0392b; }
			.btn-success { background-color: #2ecc71; color: white; }
			.btn-success:hover { background-color: #27ae60; }
			.btn-secondary { background-color: #718096; color: white; }
			.btn-secondary:hover { background-color: #4a5568; }
			.btn-warning { background-color: #e67e22; color: white; }
			.btn-warning:hover { background-color: #d35400; }
			
			table {
				width: 100%;
				border-collapse: collapse;
				margin-top: 15px;
			}
			th, td {
				border: 1px solid var(--border-color);
				padding: 12px;
				text-align: left;
			}
			th { background-color: #f8f9fa; color: #333; }
			
			.reagent-row {
				background: #fafafa;
				padding: 15px;
				border: 1px solid var(--border-color);
				border-radius: 4px;
				margin-bottom: 10px;
				display: grid;
				grid-template-columns: 2fr 1fr 1.5fr 0.8fr auto;
				gap: 10px;
				align-items: center;
			}
			
			/* マスターリスト管理用の構造スタイル */
			.master-table-wrapper {
				margin-top: 15px;
				max-height: 500px;
				overflow-y: auto;
				border: 1px solid var(--border-color);
				border-radius: 4px;
			}
			.container.master-mode .master-table-wrapper {
				border-color: var(--master-border);
			}
			.master-list-table {
				width: 100%;
				border-collapse: collapse;
				margin-top: 0;
			}
			.master-list-table th {
				position: sticky;
				top: 0;
				background: var(--master-accent); /* 優しい青ヘッダー */
				color: #ffffff;
				z-index: 10;
				border-color: var(--master-border);
			}
			.master-list-table td { 
				background: #ffffff; 
				color: #334155;
				border-color: var(--master-border);
			}
			
			/* カテゴリ見出しをグレーに */
			.category-header-row td {
				background: #f1f5f9 !important; /* 優しいライトグレー */
				color: var(--master-text) !important;
				padding: 10px 12px;
				border-bottom: 2px solid var(--master-border) !important;
				font-weight: bold;
				font-size: 14px;
			}
			
			.action-cell {
				display: flex;
				gap: 6px;
			}
			.btn-mini {
				border: none;
				padding: 5px 10px;
				border-radius: 4px;
				cursor: pointer;
				font-size: 12px;
				font-weight: bold;
				color: white;
			}
			
			/* アーカイブセクション */
			.archive-box {
				margin-top: 20px;
				border: 1px dashed #cbd5e1;
				border-radius: 6px;
				padding: 15px;
				background: #f8fafc;
				color: #333;
			}
			.container.master-mode .archive-box {
				background: #f8fafc;
				border-color: var(--master-border);
				color: #334155;
			}
			.archive-container {
				display: none;
				margin-top: 15px;
			}
			.archive-container.active {
				display: block;
			}
			
			/* データ管理用一律スタイルパネル */
			.tab-management-panel {
				background: #edf2f7;
				padding: 15px;
				border-radius: 6px;
				margin-top: 30px;
				display: flex;
				gap: 12px;
				align-items: center;
				color: #333;
			}
			.container.master-mode .tab-management-panel {
				background: #f1f5f9; /* 優しいグレー */
				color: #334155;
				border: 1px solid var(--master-border);
			}
			.panel-title {
				font-size: 14px;
				font-weight: bold;
				color: #4a5568;
				border-left: 3px solid var(--primary-color);
				padding-left: 8px;
				margin-right: auto;
			}
			.container.master-mode .panel-title {
				color: var(--master-text);
				border-left-color: var(--master-accent);
			}
			
			/* クイックカテゴリ管理エリアの装飾 */
			.quick-category-actions {
				margin-top: 12px;
				display: flex;
				gap: 10px;
				align-items: center;
			}
			
			/* 🖨️ 印刷用スタイル */
			#print-area { display: none; }
			@media print {
				@page {
					size: A4 portrait;
					margin: 0;
				}
				body * { visibility: hidden; }
				#print-area, #print-area * { visibility: visible; }
				#print-area {
					display: block;
					position: absolute;
					left: 10mm; top: 10mm;
					width: 105mm;  
					height: 148.5mm; 
					padding: 8mm 6mm; 
					border: 1px dashed #000; 
					box-sizing: border-box;
					background: white;
					overflow: hidden;
				}
				#print-area h3 {
					margin: 0 0 10px 0;
					font-size: 16px;
					border-bottom: 2px solid #000;
					padding-bottom: 4px;
					white-space: nowrap;
				}
				.print-date { text-align: right; font-size: 11px; margin-bottom: 6px; }
				#print-area .total-base-info { font-size: 12px; margin-bottom: 8px; white-space: nowrap; }
				
				#print-area table { 
					width: 100%; 
					margin-top: 10px;
					border-collapse: collapse;
					table-layout: fixed;
				}
				
				#print-area th, #print-area td { 
					padding: 12px 4px; 
					border: 1px solid #000; 
					line-height: 1.2;
					white-space: nowrap; 
					overflow: hidden;    
					text-overflow: ellipsis;
					font-size: 11px;     
				}
				
				#print-area th:nth-child(1), #print-area td:nth-child(1) { width: 38%; font-size: 11px; text-align: left; } 
				#print-area th:nth-child(2), #print-area td:nth-child(2) { width: 20%; font-size: 10px; text-align: center; } 
				#print-area th:nth-child(3), #print-area td:nth-child(3) { width: 22%; font-size: 10px; text-align: center; } 
				#print-area th:nth-child(4), #print-area td:nth-child(4) { width: 20%; font-size: 11px; text-align: right; font-weight: bold; } 
				
				#print-area tfoot td {
					font-size: 12px;
					background-color: #edf2f7 !important;
				}
			}
		</style>
	</head>
	<body>
		
		<div id="tab-nav-bar" class="tab-navigation">
			<button class="tab-btn active" onclick="switchTab('calc-tab', this)">🧪 計算システム</button>
			<button class="tab-btn" onclick="switchTab('master-tab', this)">📝 マスターリスト</button>
		</div>
		
		<div id="main-container" class="container">
			
			<div id="calc-tab" class="tab-content active">
				<h1>試薬計算システム</h1>
				
				<div class="section">
					<h2>1. 基本設定</h2>
					<div class="input-group">
						<label for="total-volume">最終量 (μL) <span style="font-size: 12px; color: #718096; font-weight: normal;">※これを元に自動計算されます</span></label>
						<input type="number" id="total-volume" value="100" min="1" oninput="calculateAll()">
					</div>
				</div>
				
				<div class="section">
					<h2>2. 試薬の選択</h2>
					<div id="reagents-container">
					</div>
					<button class="btn btn-success" onclick="addReagentRow()">＋ 追加</button>
				</div>
				
				<div class="section">
					<h2>3. 計算結果</h2>
					<table id="result-table">
						<thead>
						<tr>
							<th>試薬名</th>
							<th>ストック</th>
							<th>最終濃度</th>
							<th>必要量 (μL)</th>
						</tr>
						</thead>
						<tbody id="result-tbody">
						</tbody>
						<tfoot id="result-tfoot" style="background-color: #f1f5f9; font-weight: bold;">
						</tfoot>
					</table>
					<div style="margin-top: 20px; text-align: right;">
						<button class="btn" onclick="window.print()">印刷 (1/4サイズ)</button>
					</div>
				</div>
				
				<div class="tab-management-panel">
					<div class="panel-title">計算結果</div>
					<button class="btn btn-secondary" onclick="exportResultsToText()">保存(.txt)</button>
					<button class="btn btn-secondary" onclick="document.getElementById('results-file-input').click()">呼び出し(.txt)</button>
					<input type="file" id="results-file-input" accept=".txt" style="display: none;" onchange="importResultsFromText(this)">
				</div>
			</div>
			
			<div id="master-tab" class="tab-content">
				<h1>試薬リスト管理</h1>
				
				<div class="section" style="background: #ffffff; padding: 20px; border-radius: 6px; border: 1px solid var(--master-accent);">
					<h3 style="margin-top: 0; color: var(--master-text);">新規試薬を登録</h3>
					<div class="inline-group">
						<div>
							<label for="new-name">試薬名</label>
							<input type="text" id="new-name" placeholder="例: My-Protein">
						</div>
						<div>
							<label for="new-category">カテゴリ</label>
							<select id="new-category">
							</select>
						</div>
						<div>
							<label for="new-c1">濃度 (mg/mL)</label>
							<input type="number" id="new-c1" placeholder="空欄可" step="any" oninput="autoCalcMicromolar()">
						</div>
						<div>
							<label for="new-c2">分子量 (kDa)</label>
							<input type="number" id="new-c2" placeholder="空欄可" step="any" oninput="autoCalcMicromolar()">
						</div>
						<div>
							<label for="new-c3">ストック（数値）</label>
							<input type="number" id="new-c3" placeholder="手入力用" step="any">
						</div>
						<div>
							<label for="new-unit">単位</label>
							<select id="new-unit">
								<option value="μM">μM</option>
								<option value="mM">mM</option>
								<option value="M">M</option>
							</select>
						</div>
						<button class="btn btn-success" onclick="addNewMasterReagent()">登録</button>
					</div>
					
					<div class="quick-category-actions">
						<button class="btn btn-secondary" style="padding: 6px 14px; font-size: 13px;" onclick="promptNewCategory()">＋ 新規カテゴリを追加</button>
						<span style="color: #475569; font-size: 13px;">| カテゴリの削除:</span>
						<select id="delete-category-select" style="width: auto; padding: 4px 8px; font-size: 13px; display: inline-block; border-color: var(--master-border);">
						</select>
						<button class="btn btn-danger" style="padding: 4px 12px; font-size: 13px;" onclick="deleteCategory()">削除</button>
					</div>
					
					<p style="font-size: 12px; color: #64748b; margin: 12px 0 0 0;">
						※ mg/mL と kDa を両方入力すると、自動的に μM 換算。<br>
						※ カテゴリが「バッファー」の場合に限り、濃度指定なしで登録可（残量自動計算の対象）。
					</p>
				</div>
				
				<div class="section">
					<h2>登録済み試薬リスト（カテゴリ別・名前順）</h2>
					<div class="master-table-wrapper">
						<table class="master-list-table">
							<thead>
							<tr>
								<th>試薬名</th>
								<th>ストック</th>
								<th>登録日</th>
								<th style="width: 160px;">操作</th>
							</tr>
							</thead>
							<tbody id="master-manager-tbody">
							</tbody>
						</table>
					</div>
					
					<div class="archive-box">
						<div style="display: flex; align-items: center; justify-content: space-between;">
							<span style="font-size: 14px; font-weight: bold;">アーカイブ</span>
							<button class="btn btn-secondary" style="padding: 6px 15px; font-size: 13px;" onclick="toggleArchiveView()" id="archive-toggle-btn">一覧を表示 ▼</button>
						</div>
						
						<div class="archive-container" id="archive-content-area">
							<table class="master-list-table" style="border-top: 2px solid var(--master-accent);">
								<thead>
								<tr style="background: var(--master-accent);">
									<th>試薬名</th>
									<th>ストック</th>
									<th>登録日</th>
									<th style="width: 160px;">操作</th>
								</tr>
								</thead>
								<tbody id="master-archive-tbody">
								</tbody>
							</table>
						</div>
					</div>
				</div>
				
				<div class="tab-management-panel">
					<div class="panel-title">マスターリスト</div>
					<button class="btn btn-secondary" onclick="exportMasterToText()">保存(.txt)</button>
					<button class="btn btn-secondary" onclick="document.getElementById('master-file-input').click()">呼び出し(.txt)</button>
					<input type="file" id="master-file-input" accept=".txt" style="display: none;" onchange="importMasterFromText(this)">
				</div>
				
				<div style="text-align: right; margin-top: 20px;">
					<button class="btn btn-danger" style="padding: 8px 12px; font-size: 14px;" onclick="clearAllStorage()">自動保存を消去</button>
				</div>
			</div>
			
		</div>
		
		<div id="print-area">
			<div class="print-date">日付: <span id="current-date"></span></div>
			<h3>Mix</h3>
			<div class="total-base-info">最終液量: <span id="print-total-volume"></span> μL</div>
			<table>
				<thead>
				<tr>
					<th>試薬名</th>
					<th>S</th> 
					<th>F</th> 
					<th>必要量</th>
				</tr>
				</thead>
				<tbody id="print-tbody">
				</tbody>
				<tfoot id="print-tfoot" style="font-weight: bold;">
				</tfoot>
			</table>
		</div>
		
		<script>
			const defaultCategories = ["よく使う", "タンパク質", "核酸(DNA/RNA)", "バッファー", "その他"];
			let categoryList = [];
			
			const defaultMasterList = [
			{ id: "def-0", name: "--- 試薬を選択してください ---", type: "none", category: "システム", displayConc: "---", isDefault: true, isArchived: false, timestamp: 0 },
			{ id: "def-1", name: "MiliQ", type: "subtraction", category: "バッファー", displayConc: "---", isDefault: true, isArchived: false, timestamp: 0 },
			{ id: "def-2", name: "Buffer", type: "subtraction", category: "バッファー", displayConc: "---", isDefault: true, isArchived: false, timestamp: 0 },
			];
			
			let masterList = [];
			let rowCounter = 0;
			let isArchiveVisible = false;
			
			window.onload = function() {
				const today = new Date();
				document.getElementById('current-date').innerText = today.toLocaleDateString('ja-JP');
				
				loadFromLocalStorage();
				calculateAll();
			};
			
			// タブ切り替え（画面全体をパステルブルーに変更するよう拡張）
			function switchTab(tabId, btnElement) {
				const contents = document.querySelectorAll('.tab-content');
				contents.forEach(content => content.classList.remove('active'));
				
				const buttons = document.querySelectorAll('.tab-btn');
				buttons.forEach(btn => btn.classList.remove('active'));
				
				document.getElementById(tabId).classList.add('active');
				btnElement.classList.add('active');
				
				const container = document.getElementById('main-container');
				const navBar = document.getElementById('tab-nav-bar');
				const body = document.body;
				
				if (tabId === 'master-tab') {
					body.classList.add('master-mode-active');       /* body全体を青調へ */
					container.classList.add('master-mode');
					navBar.classList.add('master-active');
				} else {
					body.classList.remove('master-mode-active');    /* body全体をリセット */
					container.classList.remove('master-mode');
					navBar.classList.remove('master-active');
				}
			}
			
			// 自動換算
			function autoCalcMicromolar() {
				const c1 = parseFloat(document.getElementById('new-c1').value);
				const c2 = parseFloat(document.getElementById('new-c2').value);
				
				if (!isNaN(c1) && !isNaN(c2) && c2 > 0) {
					const micromolar = (c1 / c2) * 1000;
					document.getElementById('new-c3').value = micromolar.toFixed(2);
					document.getElementById('new-unit').value = "μM";
					document.getElementById('new-c3').disabled = true;
					document.getElementById('new-unit').disabled = true;
				} else {
					document.getElementById('new-c3').disabled = false;
					document.getElementById('new-unit').disabled = false;
				}
			}
			
			// --- ① LocalStorageへの自動保存・読込処理 ---
			function saveToLocalStorage() {
				const currentSetup = {
					masterList: masterList,
					categoryList: categoryList,
					totalVolume: document.getElementById('total-volume').value,
					reagents: []
				};
				
				const container = document.getElementById('reagents-container');
				const rows = container.children;
				for (let i = 0; i < rows.length; i++) {
					const idSuffix = rows[i].id.split('-')[1];
					const select = document.getElementById(`select-${idSuffix}`);
					const concInput = document.getElementById(`conc-${idSuffix}`);
					const unitSelect = document.getElementById(`unit-${idSuffix}`);
					if (select) {
						const selectedReagent = masterList[select.value];
						currentSetup.reagents.push({
								selectId: selectedReagent ? selectedReagent.id : '',
								concValue: concInput ? concInput.value : '',
								unitValue: unitSelect ? unitSelect.value : 'μM'
						});
					}
				}
				localStorage.setItem('reagent_calc_state_v4', JSON.stringify(currentSetup));
			}
			
			function loadFromLocalStorage() {
				const savedData = localStorage.getItem('reagent_calc_state_v4');
				const container = document.getElementById('reagents-container');
				container.innerHTML = '';
				rowCounter = 0;
				
				if (savedData) {
					try {
						const data = JSON.parse(savedData);
						masterList = data.masterList || [...defaultMasterList];
						categoryList = data.categoryList || [...defaultCategories];
						
						masterList.forEach(m => {
								if (m.category === "バッファー/塩/添加剤") m.category = "バッファー";
						});
						categoryList = categoryList.map(c => c === "バッファー/塩/添加剤" ? "バッファー" : c);
						
						masterList.forEach((m, idx) => { 
								if(!m.id) m.id = "custom-" + Date.now() + "-" + idx; 
								if(!m.category) m.category = "その他";
						});
						
						document.getElementById('total-volume').value = data.totalVolume || 100;
						
						if (data.reagents && data.reagents.length > 0) {
							data.reagents.forEach(r => {
									const idx = masterList.findIndex(m => m.id === r.selectId);
									addReagentRow(idx >= 0 ? idx : 0, r.concValue, r.unitValue || 'μM');
							});
						} else { addReagentRow(); }
					} catch (e) { resetToDefault(); }
				} else { resetToDefault(); }
				updateCategoryDropdowns();
				renderMasterTables();
			}
			
			function resetToDefault() {
				masterList = JSON.parse(JSON.stringify(defaultMasterList));
				categoryList = [...defaultCategories];
				document.getElementById('total-volume').value = 100;
				addReagentRow();
				updateCategoryDropdowns();
				renderMasterTables();
			}
			
			function clearAllStorage() {
				if(confirm("ブラウザに自動保存された作業状態と、登録したマスターリストをすべて初期化しますか？")) {
					localStorage.removeItem('reagent_calc_state_v4');
					resetToDefault();
					switchTab('calc-tab', document.querySelectorAll('.tab-btn')[0]);
					calculateAll();
				}
			}
			
			function generateTimestampFilename(prefix) {
				const now = new Date();
				return `${prefix}_${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}_` +
				`${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}.txt`;
			}
			
			// --- ② テキストファイル（.txt）での保存・読込処理（計算結果） ---
			function exportResultsToText() {
				const tableRows = document.querySelectorAll('#result-tbody tr');
				if (tableRows.length === 0) { alert("保存する計算結果がありません。"); return; }
				
				const totalVolText = document.querySelector('#result-tfoot td:last-child').innerText;
				const calculatedTotal = parseFloat(totalVolText) || 0;
				
				const exportData = { dataType: "experimental_results", totalVolume: calculatedTotal, results: [] };
				tableRows.forEach(tr => {
						const tds = tr.querySelectorAll('td');
						exportData.results.push({ name: tds[0].innerText, stockConc: tds[1].innerText, targetConc: tds[2].innerText, volume: tds[3].innerText });
				});
				
				const textData = JSON.stringify(exportData, null, 2);
				const blob = new Blob([textData], { type: 'text/plain;charset=utf-8' });
				const filename = generateTimestampFilename("results");
				const a = document.createElement('a');
				a.href = URL.createObjectURL(blob); a.download = filename; a.click(); URL.revokeObjectURL(a.href);
			}
			
			function importResultsFromText(input) {
				const file = input.files[0]; if (!file) return;
				const reader = new FileReader();
				reader.onload = function(e) {
					try {
						const data = JSON.parse(e.target.result);
						if (data.dataType !== "experimental_results" && !data.results) { throw new Error("ミスマッチ"); }
						
						document.getElementById('total-volume').value = data.totalVolume;
						const container = document.getElementById('reagents-container');
						container.innerHTML = ''; rowCounter = 0;
						
						data.results.forEach(r => {
								if (r.targetConc.includes("---")) {
									let idx = masterList.findIndex(m => m.name === r.name);
									if(idx === -1) {
										masterList.push({ id: "custom-" + Date.now() + "-" + Math.random(), name: r.name, type: "subtraction", category: "バッファー", displayConc: "---", timestamp: Date.now(), isArchived: false });
										idx = masterList.length - 1;
									}
									addReagentRow(idx, '', 'μM');
								} else {
									let idx = masterList.findIndex(m => m.name === r.name);
									
									const matchTarget = r.targetConc.match(/^([0-9.]+)\s*(μM|mM|M)$/);
									let numericTarget = 0;
									let targetUnit = 'μM';
									if (matchTarget) {
										numericTarget = parseFloat(matchTarget[1]);
										targetUnit = matchTarget[2];
									} else {
										numericTarget = parseFloat(r.targetConc) || 0;
									}
									
									if (idx === -1) {
										const match = r.stockConc.match(/^([0-9.]+)\s*(μM|mM|M)$/);
										let rawConc = 1000; let unit = 'μM';
										if(match) { rawConc = parseFloat(match[1]); unit = match[2]; }
										masterList.push({ id: "custom-" + Date.now() + "-" + Math.random(), name: r.name, type: "normal", category: "その他", c3: rawConc, unit: unit, displayConc: r.stockConc, timestamp: Date.now(), isArchived: false });
										idx = masterList.length - 1;
									}
									addReagentRow(idx, numericTarget, targetUnit);
								}
						});
						updateAllSelectBoxes(); renderMasterTables(); calculateAll();
						alert("テキストファイルから実験データを正常に読み込み、再現しました。");
					} catch (err) { alert("読み込みに失敗しました。正しい「計算結果用」テキストファイルか確認してください。"); }
					input.value = '';
				};
				reader.readAsText(file);
			}
			
			// --- ③ テキストファイル（.txt）での保存・読込処理（マスターリスト） ---
			function exportMasterToText() {
				const exportData = { dataType: "master_reagent_list_v2", masterList: masterList, categoryList: categoryList };

			function importMasterFromText(input) {
				const file = input.files[0]; if (!file) return;
				const reader = new FileReader();
				reader.onload = function(e) {
					try {
						const data = JSON.parse(e.target.result);

			// --- カテゴリの追加ダイアログ処理 ---
			function promptNewCategory() {
				const newCat = prompt("追加したい新しいカテゴリ名を入力してください:");
				if (newCat === null) return; 
				
				const cleanedCat = newCat.trim();
				if (!cleanedCat) { alert("カテゴリ名が空欄です。"); return; }
				if (categoryList.includes(cleanedCat) || cleanedCat === "システム" || cleanedCat === "引き算用バッファー") { 
					alert("そのカテゴリ名は既に存在します。"); return; 
				}
				
				categoryList.push(cleanedCat);
				updateCategoryDropdowns();
				updateAllSelectBoxes();
				renderMasterTables();
				saveToLocalStorage();
				alert(`新しいカテゴリ「${cleanedCat}」を追加しました！`);
			}
			
			// カテゴリの削除
			function deleteCategory() {
				const select = document.getElementById('delete-category-select');
				const catToDelete = select.value;
				
				if (!catToDelete) { alert("削除するカテゴリを選択してください。"); return; }
				if (catToDelete === "その他") { alert("「その他」カテゴリは削除できません。"); return; }
				
				if (confirm(`カテゴリ「${catToDelete}」を削除しますか？\n※このカテゴリに属する試薬がある場合、自動的に「その他」カテゴリへ安全に移動されます。`)) {
					masterList.forEach(m => {
							if (m.category === catToDelete) { m.category = "その他"; }
					});
					
					categoryList = categoryList.filter(cat => cat !== catToDelete);
					
					updateCategoryDropdowns();
					updateAllSelectBoxes();
					renderMasterTables();
					calculateAll();
					alert(`カテゴリ「${catToDelete}」を削除し、関連する試薬を「その他」へ退避させました。`);
				}
			}
			
			function updateCategoryDropdowns() {
				const regSelect = document.getElementById('new-category');
				regSelect.innerHTML = '';
				categoryList.forEach(cat => {
						const opt = document.createElement('option');
						opt.value = cat; opt.text = cat;
						regSelect.appendChild(opt);
				});
				
				const delSelect = document.getElementById('delete-category-select');
				delSelect.innerHTML = '';

						if (cat === "その他") return;

						opt.value = cat; opt.text = cat;
						delSelect.appendChild(opt);
				});
			}
			
			// 管理用マスターリストの表示
			function renderMasterTables() {
				const activeTbody = document.getElementById('master-manager-tbody');
				const archiveTbody = document.getElementById('master-archive-tbody');
				activeTbody.innerHTML = ''; archiveTbody.innerHTML = '';
				
				let activeGroups = {};
				let archiveGroups = {};
				
				categoryList.forEach(cat => {
						activeGroups[cat] = [];
						archiveGroups[cat] = [];
				});
				if (!activeGroups["その他"]) { activeGroups["その他"] = []; archiveGroups["その他"] = []; }
				
				masterList.forEach((reagent, originalIndex) => {
						if (originalIndex === 0 || reagent.isDefault) return;
						
						let cat = reagent.category || "other";
						if (!activeGroups[cat]) cat = "unknown";
						
						const targetGroup = reagent.isArchived ? archiveGroups : activeGroups;
						if (targetGroup[cat]) {
							targetGroup[cat].push({ reagent, originalIndex });
						} else {
							targetGroup["その他"].push({ reagent, originalIndex });
						}
				});
				
				const nameSorter = (a, b) => a.reagent.name.localeCompare(b.reagent.name, 'ja', { numeric: true, sensitivity: 'base' });
				categoryList.forEach(cat => {
						activeGroups[cat].sort(nameSorter);
						archiveGroups[cat].sort(nameSorter);
				});
				
				let activeTotalRows = 0;
				categoryList.forEach(cat => {
						if (activeGroups[cat].length === 0) return;
						activeTbody.innerHTML += `<tr class="category-header-row"><td colspan="4">■ ${cat} (${activeGroups[cat].length}件)</td></tr>`;
						activeGroups[cat].forEach(item => {
								const r = item.reagent;
								const dateStr = r.timestamp ? new Date(r.timestamp).toLocaleDateString('ja-JP') : "---";
								activeTbody.innerHTML += `
								<tr>
								<td><strong>${r.name}</strong></td>
								<td><span class="unit-badge">${r.displayConc}</span></td>
								<td style="color:#475569; font-size:14px;">${dateStr}</td>
								<td class="action-cell">
								<button class="btn-mini btn-warning" onclick="archiveMasterReagent(${item.originalIndex})">アーカイブ</button>
								<button class="btn-mini btn-danger" onclick="deleteMasterReagent(${item.originalIndex})">完全削除</button>
								</td>
								</tr>
								`;
								activeTotalRows++;
						});
				});
				
				let archiveTotalRows = 0;
				categoryList.forEach(cat => {
						if (archiveGroups[cat].length === 0) return;
						archiveTbody.innerHTML += `<tr class="category-header-row"><td colspan="4">■ ${cat} (${archiveGroups[cat].length}件)</td></tr>`;
						archiveGroups[cat].forEach(item => {
								const r = item.reagent;
								const dateStr = r.timestamp ? new Date(r.timestamp).toLocaleDateString('ja-JP') : "---";
								archiveTbody.innerHTML += `
								<tr>
								<td><strong>${r.name}</strong></td>
								<td><span class="unit-badge">${r.displayConc}</span></td>
								<td style="color:#475569; font-size:14px;">${dateStr}</td>
								<td class="action-cell">
								<button class="btn-mini btn-success" onclick="restoreMasterReagent(${item.originalIndex})">復元</button>
								<button class="btn-mini btn-danger" onclick="deleteMasterReagent(${item.originalIndex})">完全削除</button>
								</td>
								</tr>
								`;
								archiveTotalRows++;
						});
				});
				
				if (activeTotalRows === 0) { activeTbody.innerHTML = `<tr><td colspan="4" style="padding:20px; color:#475569; text-align:center; font-style:italic;">有効な試薬はありません</td></tr>`; }
				if (archiveTotalRows === 0) { archiveTbody.innerHTML = `<tr><td colspan="4" style="padding:20px; color:#475569; text-align:center; font-style:italic;">アーカイブされた試薬はありません</td></tr>`; }
			}
			
			function archiveMasterReagent(index) {
				const reagent = masterList[index]; if (!reagent) return;
				if (confirm(`試薬「${reagent.name}」をアーカイブしますか？\n(計算システムの選択行からは自動的に外れます)`)) {
					reagent.isArchived = true; resetSelectedRowIfMatches(index);
					updateAllSelectBoxes(); renderMasterTables(); calculateAll();
				}
			}
			
			function restoreMasterReagent(index) {
				const reagent = masterList[index]; if (!reagent) return;
				reagent.isArchived = false;
				updateAllSelectBoxes(); renderMasterTables(); calculateAll();
				alert(`「${reagent.name}」を計算用システムへ復元しました。`);
			}
			
			function deleteMasterReagent(index) {
				const reagent = masterList[index]; if (!reagent) return;
				if (confirm(`試薬「${reagent.name}」をマスターリストから【完全に削除】しますか？\nこの操作は取り消せるません。`)) {
					resetSelectedRowIfMatches(index); masterList.splice(index, 1);
					updateAllSelectBoxes(); renderMasterTables(); calculateAll();
				}
			}
			
			function resetSelectedRowIfMatches(targetIndex) {
				const container = document.getElementById('reagents-container');
				const rows = container.children;
				for (let i = 0; i < rows.length; i++) {
					const idSuffix = rows[i].id.split('-')[1];
					const select = document.getElementById(`select-${idSuffix}`);
					if (select) {
						const currentVal = parseInt(select.value);
						if (currentVal === targetIndex) {
							select.value = 0; handleReagentChange(idSuffix, false);
						} else if (currentVal > targetIndex) {
							select.value = currentVal - 1;
						}
					}
				}
			}
			
			function addNewMasterReagent() {
				const name = document.getElementById('new-name').value.trim();
				const category = document.getElementById('new-category').value;
				const c3 = parseFloat(document.getElementById('new-c3').value);
				const unit = document.getElementById('new-unit').value;
				
				if (!name) { alert("試薬名を入力してください。"); return; }
				
				let isSub = false; let displayConc = ""; let finalC3 = c3;
				if (category === "バッファー" && isNaN(c3)) {
					isSub = true; displayConc = "---"; finalC3 = null;
				} else {
					if (isNaN(c3)) { alert("正しいストック濃度を入力してください。"); return; }
					displayConc = `${c3} ${unit}`;
				}
				if (masterList.some(m => m.name.toLowerCase() === name.toLowerCase())) { alert(``+name+`は既に登録されています。`); return; }
				
				const newId = "custom-" + Date.now() + "-" + Math.floor(Math.random()*1000);
				masterList.push({ id: newId, name: name, type: isSub ? "subtraction" : "normal", category: category, c3: finalC3, unit: unit, displayConc: displayConc, isDefault: false, isArchived: false, timestamp: Date.now() });
				
				updateAllSelectBoxes(); renderMasterTables();
				document.getElementById('new-name').value = '';
				document.getElementById('new-c1').value = ''; document.getElementById('new-c2').value = '';
				document.getElementById('new-c3').value = '';
				document.getElementById('new-c3').disabled = false; document.getElementById('new-unit').disabled = false;
				
				calculateAll();
				alert(`「${name}」を新しく登録しました！`);
			}
			
			function buildGroupedSelectHtml(selectId, currentIdValue) {
				let groups = { "システム": [] };
				categoryList.forEach(cat => { groups[cat] = []; });
				if (!groups["その他"]) groups["その他"] = [];
				
				masterList.forEach((reagent, index) => {
						if (index === 0) { groups["システム"].push({ index, name: reagent.name }); return; }
						if (reagent.isArchived) return;
						
						let cat = reagent.category || "その他";
						if (!groups[cat]) cat = "その他";
						
						groups[cat].push({ index, name: reagent.name });
				});
				
				const selectSorter = (a, b) => a.name.localeCompare(b.name, 'ja', { numeric: true });
				for(const key in groups) { if(key !== "システム") { groups[key].sort(selectSorter); } }
				
				let html = `<select id="${selectId}" onchange="handleReagentChange(${selectId.split('-')[1]})">`;
				groups["システム"].forEach(item => {
						html += `<option value="${item.index}" ${item.index == currentIdValue ? 'selected' : ''}>${item.name}</option>`;
				});
				categoryList.forEach(key => {
						if (groups[key].length === 0) return;
						html += `<optgroup label="【${key}】">`;
						groups[key].forEach(item => {
								html += `<option value="${item.index}" ${item.index == currentIdValue ? 'selected' : ''}>${item.name}</option>`;
						});
						html += `</optgroup>`;
				});
				html += `</select>`;
				return html;
			}
			
			function updateAllSelectBoxes() {
				const container = document.getElementById('reagents-container');
				const rows = container.children;
				for (let i = 0; i < rows.length; i++) {
					const idSuffix = rows[i].id.split('-')[1];
					const select = document.getElementById(`select-${idSuffix}`);
					if (!select) continue;
					const currentValue = select.value;
					const parent = select.parentElement;
					const savedValue = (currentValue < masterList.length && !masterList[currentValue].isArchived) ? currentValue : 0;
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = buildGroupedSelectHtml(`select-${idSuffix}`, savedValue);
					parent.replaceChild(tempDiv.firstChild, select);
					handleReagentChange(idSuffix, false);
				}
			}
			
			function addReagentRow(initialSelectValue = 0, initialConcValue = '', initialUnitValue = 'μM') {
				const container = document.getElementById('reagents-container');
				const currentId = rowCounter++;
				const row = document.createElement('div');
				row.className = 'reagent-row'; row.id = `row-${currentId}`;
				const selectHtml = buildGroupedSelectHtml(`select-${currentId}`, initialSelectValue);
				
				row.innerHTML = `
				${selectHtml}
				<div id="stock-display-${currentId}" style="font-size: 14px; color: #64748b; font-weight: bold; text-align: center;">---</div>
				<div id="input-zone-${currentId}" style="display: flex; gap: 5px; align-items: center;">
				<input type="number" id="conc-${currentId}" value="${initialConcValue}" min="0" placeholder="最終濃度" style="display:none;" oninput="validateAndCalculate(${currentId})">
				<select id="unit-${currentId}" style="display:none; width: auto; padding: 10px 5px;" onchange="calculateAll()">
				<option value="μM">μM</option>
				<option value="mM">mM</option>
				<option value="M">M</option>
				</select>
				</div>
				<button class="btn btn-danger" onclick="removeReagentRow(${currentId})">削除</button>
				`;
				container.appendChild(row);
				const unitSelect = document.getElementById(`unit-${currentId}`);
				if(unitSelect) unitSelect.value = initialUnitValue;
				handleReagentChange(currentId, false);
			}
			
			function validateAndCalculate(idSuffix) {
				const concInput = document.getElementById('conc-' + idSuffix);
				if (concInput && parseFloat(concInput.value) < 0) { concInput.value = 0; }
				calculateAll();
			}
			
			function removeReagentRow(index) {
				const row = document.getElementById(`row-${index}`);
				if (row) { row.remove(); calculateAll(); }
			}
			
			function handleReagentChange(index, triggerSave = true) {
				const select = document.getElementById(`select-${index}`);
				const concInput = document.getElementById(`conc-${index}`);
				const unitSelect = document.getElementById(`unit-${index}`);
				const stockDisplay = document.getElementById(`stock-display-${index}`);
				const reagent = masterList[select.value];
				
				if (reagent) {
					if (reagent.type === 'normal') {
						concInput.style.display = 'block'; unitSelect.style.display = 'block';
						stockDisplay.innerText = reagent.displayConc; stockDisplay.style.color = "#334155";
					} else if (reagent.type === 'subtraction') {
						concInput.style.display = 'none'; concInput.value = ''; unitSelect.style.display = 'none';
						stockDisplay.innerText = "---"; stockDisplay.style.color = "#64748b";
					} else {
						concInput.style.display = 'none'; concInput.value = ''; unitSelect.style.display = 'none';
						stockDisplay.innerText = "---"; stockDisplay.style.color = "#94a3b8";
					}
				}
				if (triggerSave) { calculateAll(); }
			}
			
			function calculateAll() {
				const totalVolumeBase = parseFloat(document.getElementById('total-volume').value) || 0;
				const container = document.getElementById('reagents-container');
				const rows = container.children;
				let normalReagents = []; let subtractionReagents = []; let totalNormalVolume = 0;
				
				for (let i = 0; i < rows.length; i++) {
					const idSuffix = rows[i].id.split('-')[1];
					const select = document.getElementById(`select-${idSuffix}`);
					const concInput = document.getElementById(`conc-${idSuffix}`);
					const unitSelect = document.getElementById(`unit-${idSuffix}`);
					
					if (!select || select.value == 0) continue;
					const reagent = masterList[select.value];
					if (!reagent || reagent.isArchived) continue;
					
					if (reagent.type === 'normal') {
						const inputTargetVal = parseFloat(concInput.value) || 0;
						const targetUnit = unitSelect.value;
						let targetConcμM = inputTargetVal;
						if (targetUnit === 'mM') targetConcμM = inputTargetVal * 1000;
						else if (targetUnit === 'M') targetConcμM = inputTargetVal * 1000000;
						
						let stockConcμM = reagent.unit === 'mM' ? reagent.c3 * 1000 : (reagent.unit === 'M' ? reagent.c3 * 1000000 : reagent.c3);
						let requiredVol = stockConcμM > 0 ? (targetConcμM * totalVolumeBase) / stockConcμM : 0;
						
						totalNormalVolume += requiredVol;
						normalReagents.push({ name: reagent.name, stock: reagent.displayConc, target: inputTargetVal.toFixed(2) + " " + targetUnit, volume: requiredVol });
					} else if (reagent.type === 'subtraction') {
						subtractionReagents.push({ name: reagent.name, stock: "---", target: "---", volume: 0 });
					}
				}
				
				const remainingVolume = Math.max(0, totalVolumeBase - totalNormalVolume);
				if (subtractionReagents.length > 0) {
					const volPerSubReagent = remainingVolume / subtractionReagents.length;
					subtractionReagents.forEach(r => { r.volume = volPerSubReagent; });
				}
				
				const allResults = [...normalReagents, ...subtractionReagents];
				let absoluteTotalVolume = 0;
				allResults.forEach(r => { absoluteTotalVolume += r.volume; });
				
				updateTables(allResults, absoluteTotalVolume);
				saveToLocalStorage();
			}
			
			function updateTables(results, totalVolume) {
				const tbody = document.getElementById('result-tbody');
				const tfoot = document.getElementById('result-tfoot');
				const printTbody = document.getElementById('print-tbody');
				const printTfoot = document.getElementById('print-tfoot');
				
				tbody.innerHTML = ''; printTbody.innerHTML = '';
				if(tfoot) tfoot.innerHTML = ''; if(printTfoot) printTfoot.innerHTML = '';
				
				document.getElementById('print-total-volume').innerText = totalVolume.toFixed(2);
				results.forEach(r => {
						const row = `<tr><td>${r.name}</td><td>${r.stock}</td><td>${r.target}</td><td style="font-weight:bold; color:#2c3e50;">${r.volume.toFixed(2)} μL</td></tr>`;
						tbody.innerHTML += row;
						const printRow = `<tr><td>${r.name}</td><td>${r.stock}</td><td>${r.target}</td><td>${r.volume.toFixed(2)} μL</td></tr>`;
						printTbody.innerHTML += printRow;
				});
				
				const totalRowHtml = `<tr>
				<td style="font-weight: bold; background-color: #e2e8f0; color: #1a202c;">Total Volume</td>
				<td style="background-color: #e2e8f0;"></td><td style="background-color: #e2e8f0;"></td>
				<td style="font-weight: bold; background-color: #e2e8f0; color: #1a202c;">${totalVolume.toFixed(2)} μL</td>
				</tr>`;
				
				const printTotalRowHtml = `<tr><td style="font-weight: bold;">Total Volume</td><td></td><td></td><td style="font-weight: bold;">${totalVolume.toFixed(2)} μL</td></tr>`;
				
				if(tfoot) tfoot.innerHTML = totalRowHtml; 
				if(printTfoot) printTfoot.innerHTML = printTotalRowHtml;
			}
		</script>
	</body>
</html>
